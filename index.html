    function triggerDownload() {
      const fullHtml = document.getElementById('raw-code').textContent;
      const blob = new Blob([fullHtml], { type: 'text/html' });

<!DOCTYPE html>

  <script>
    let audioCtx = null;
    function playWhistleSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        [0, 0.25].forEach(offset => {
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(1800, audioCtx.currentTime + offset);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime + offset);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + offset + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime + offset);
          osc.stop(audioCtx.currentTime + offset + 0.2);
        });
        if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
      } catch (e) {
        console.error(e);
      }
    }

    function requestNotificationPermission() {
      if (!("Notification" in window)) {
        alert("This browser does not support web push notifications.");
        return;
      }
      Notification.requestPermission().then(permission => {
        const btn = document.getElementById('notifyBtn');
        if (permission === "granted") {
          btn.innerText = "✓ Apple Watch Alerts Active";
          btn.style.background = "rgba(76, 175, 80, 0.4)";
          new Notification("Fair Play Soccer", {
            body: "Notifications enabled! Alerts will vibrate your Apple Watch."
          });
        }
      });
    }

    function sendWatchNotification(title, message) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, {
          body: message,
          icon: 'https://img.icons8.com/color/96/football2--v1.png',
          vibrate: [300, 100, 300]
        });
      }
    }

    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (tabId === 'gameTab') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('gameTab').classList.add('active');
      } else {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('statsTab').classList.add('active');
        renderSeasonStats();
        renderManageRoster();
      }
    }

    let timerInterval = null;
    let timerState = JSON.parse(localStorage.getItem('soccer_timer_v9')) || {
      running: false,
      remaining: 6 * 60,
      totalDuration: 6 * 60,
      lastTick: null,
      shift: 1
    };
    let gameConfig = JSON.parse(localStorage.getItem('soccer_game_config_v9')) || {
      gameDuration: 40,
      shiftDuration: 6
    };
    let formation = JSON.parse(localStorage.getItem('soccer_formation_v9')) || { GK: 1, DEF: 2, MID: 2, FWD: 2 };
    let currentAssignment = JSON.parse(localStorage.getItem('soccer_current_assignment_v9')) || { GK: [], DEF: [], MID: [], FWD: [], BENCH: [] };
    let previousAssignment = JSON.parse(localStorage.getItem('soccer_prev_assignment_v9')) || null;

    let players = JSON.parse(localStorage.getItem('soccer_squad_v9')) || [
      { id: 1, number: 7,  name: "Alex", present: true, stats: { GK: 0, DEF: 0, MID: 0, FWD: 0, BENCH: 0, totalPlayed: 0, totalMinutes: 0 } },
      { id: 2, number: 10, name: "Sam",  present: true, stats: { GK: 0, DEF: 0, MID: 0, FWD: 0, BENCH: 0, totalPlayed: 0, totalMinutes: 0 } },
      { id: 3, number: 4,  name: "Liam", present: true, stats: { GK: 0, DEF: 0, MID: 0, FWD: 0, BENCH: 0, totalPlayed: 0, totalMinutes: 0 } },
      { id: 4, number: 9,  name: "Maya", present: true, stats: { GK: 0, DEF: 0, MID: 0, FWD: 0, BENCH: 0, totalPlayed: 0, totalMinutes: 0 } },
      { id: 5, number: 2,  name: "Noah", present: true, stats: { GK: 0, DEF: 0, MID: 0, FWD: 0, BENCH: 0, totalPlayed: 0, totalMinutes: 0 } },
      { id: 6, number: 8,  name: "Emma", present: true, stats: { GK: 0, DEF: 0, MID: 0, FWD: 0, BENCH: 0, totalPlayed: 0, totalMinutes: 0 } },
      { id: 7, number: 11, name: "Leo",  present: true, stats: { GK: 0, DEF: 0, MID: 0, FWD: 0, BENCH: 0, totalPlayed: 0, totalMinutes: 0 } },
      { id: 8, number: 5,  name: "Zoe",  present: true, stats: { GK: 0, DEF: 0, MID: 0, FWD: 0, BENCH: 0, totalPlayed: 0, totalMinutes: 0 } }
    ];

    function saveAll() {
      localStorage.setItem('soccer_squad_v9', JSON.stringify(players));
      localStorage.setItem('soccer_timer_v9', JSON.stringify(timerState));
      localStorage.setItem('soccer_current_assignment_v9', JSON.stringify(currentAssignment));
      localStorage.setItem('soccer_prev_assignment_v9', JSON.stringify(previousAssignment));
      localStorage.setItem('soccer_formation_v9', JSON.stringify(formation));
      localStorage.setItem('soccer_game_config_v9', JSON.stringify(gameConfig));
    }

    function calculateFairPlay() {
      formation.GK = parseInt(document.getElementById('numGK').value) || 0;
      formation.DEF = parseInt(document.getElementById('numDEF').value) || 0;
      formation.MID = parseInt(document.getElementById('numMID').value) || 0;
      formation.FWD = parseInt(document.getElementById('numFWD').value) || 0;
      
      const gameMins = parseInt(document.getElementById('gameDurationSelect').value) || 40;
      gameConfig.gameDuration = gameMins;

      const fieldSpots = formation.GK + formation.DEF + formation.MID + formation.FWD;
      const attending = players.filter(p => p.present).length;
      const banner = document.getElementById('calcOutput');

      if (attending === 0 || fieldSpots === 0) {
        banner.innerHTML = "Check attendance and field spots.";
        return;
      }

      if (attending <= fieldSpots) {
        gameConfig.shiftDuration = gameMins;
        banner.innerHTML = `<b>No bench needed!</b> ${attending} players for ${fieldSpots} field slots.<br>Everyone plays all <b>${gameMins} minutes</b>.`;
      } else {
        const totalPlayerMinutes = gameMins * fieldSpots;
        const fairTimePerPlayer = (totalPlayerMinutes / attending).toFixed(1);
        let bestShifts = Math.round(gameMins / 6);
        if (bestShifts < 4) bestShifts = 4;
        let shiftMinutes = (gameMins / bestShifts).toFixed(1);
        gameConfig.shiftDuration = parseFloat(shiftMinutes);

        banner.innerHTML = `👥 <b>${attending} present</b> | <b>${fieldSpots} field slots</b>.<br>⏱ Target: <b>${fairTimePerPlayer} mins</b> per player.<br>🔄 <b>${bestShifts} rotations</b> of <b>~${shiftMinutes} min</b> each.`;

        if (!timerState.running) {
          timerState.totalDuration = Math.round(parseFloat(shiftMinutes) * 60);
          timerState.remaining = timerState.totalDuration;
          updateTimerDisplay();
        }
      }
      saveAll();
    }

    function initTimerFromStorage() {
      if (timerState.running && timerState.lastTick) {
        const now = Date.now();
        const elapsedSeconds = Math.floor((now - timerState.lastTick) / 1000);
        timerState.remaining = Math.max(0, timerState.remaining - elapsedSeconds);
        timerState.lastTick = now;
      }
      updateTimerDisplay();
      document.getElementById('shiftIndicator').innerText = `SHIFT ${timerState.shift}`;
      document.getElementById('gameDurationSelect').value = gameConfig.gameDuration;

      if ("Notification" in window && Notification.permission === "granted") {
        const btn = document.getElementById('notifyBtn');
        btn.innerText = "✓ Apple Watch Alerts Active";
        btn.style.background = "rgba(76, 175, 80, 0.4)";
      }

      if (timerState.running && timerState.remaining > 0) {
        startTimerLoop();
      } else if (timerState.running && timerState.remaining === 0) {
        timerState.running = false;
        saveAll();
      }
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerState.remaining / 60);
      const secs = timerState.remaining % 60;
      document.getElementById('timer').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function startTimerLoop() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const now = Date.now();
        const delta = Math.floor((now - (timerState.lastTick || now)) / 1000);
        if (delta >= 1) {
          timerState.remaining = Math.max(0, timerState.remaining - delta);
          timerState.lastTick = now;
          saveAll();
          updateTimerDisplay();

          if (timerState.remaining === 0) {
            pauseTimer();
            playWhistleSound();
            sendWatchNotification("⏰ Shift Ended!", "Time to rotate players on the field.");
            alert("⏰ Shift completed! Time for substitutions.");
          }
        }
      }, 500);
    }

    function startTimer() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      requestWakeLock();
      timerState.running = true;
      timerState.lastTick = Date.now();
      saveAll();
      startTimerLoop();
    }

    function pauseTimer() {
      timerState.running = false;
      timerState.lastTick = null;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
      saveAll();
    }

    function resetTimer() {
      pauseTimer();
      timerState.remaining = timerState.totalDuration;
      saveAll();
      updateTimerDisplay();
    }

    function addPlayer() {
      const nameInput = document.getElementById('newPlayerName');
      const numInput = document.getElementById('newPlayerNumber');
      const name = nameInput.value.trim();
      const number = numInput.value.trim() || '?';
      if (!name) return;

      players.push({
        id: Date.now(),
        number: number,
        name: name,
        present: true,
        stats: { GK: 0, DEF: 0, MID: 0, FWD: 0, BENCH: 0, totalPlayed: 0, totalMinutes: 0 }
      });

      nameInput.value = '';
      numInput.value = '';
      saveAll();
      renderAttendanceTable();
      renderSeasonStats();
      renderManageRoster();
      calculateFairPlay();
    }

    function toggleAttendance(id) {
      const p = players.find(x => x.id === id);
      if (p) p.present = !p.present;
      saveAll();
      renderAttendanceTable();
      calculateFairPlay();
    }

    function deletePlayer(id) {
      if (confirm("Remove this player from squad?")) {
        players = players.filter(x => x.id !== id);
        saveAll();
        renderAttendanceTable();
        renderSeasonStats();
        renderManageRoster();
        calculateFairPlay();
      }
    }

    function renderAttendanceTable() {
      const tbody = document.getElementById('attendanceTableBody');
      tbody.innerHTML = players.map(p => `
        <tr>
          <td style="text-align: center;">
            <input type="checkbox" style="transform: scale(1.2);" ${p.present ? 'checked' : ''} onchange="toggleAttendance(${p.id})">
          </td>
          <td><span class="num-pill">#${p.number}</span></td>
          <td>
            <span style="font-weight: 600; ${!p.present ? 'color:#aaa; text-decoration:line-through' : ''}">
              ${p.name}
            </span>
          </td>
          <td style="text-align: right; font-weight: bold; font-size: 13px;">${p.stats.totalPlayed}</td>
        </tr>
      `).join('');
    }

    function renderManageRoster() {
      const tbody = document.getElementById('manageRosterTableBody');
      tbody.innerHTML = players.map(p => `
        <tr>
          <td><span class="num-pill">#${p.number}</span></td>
          <td style="font-weight: 600;">${p.name}</td>
          <td style="text-align: right;">
            <button class="danger" style="padding: 2px 8px; font-size: 11px;" onclick="deletePlayer(${p.id})">✕ Remove</button>
          </td>
        </tr>
      `).join('');
    }

    function renderSeasonStats() {
      const tbody = document.getElementById('seasonStatsTableBody');
      tbody.innerHTML = players.map(p => `
        <tr>
          <td><span class="num-pill">#${p.number}</span></td>
          <td style="font-weight: 700;">${p.name}</td>
          <td style="text-align: center; font-weight: bold; color: var(--primary);">${p.stats.totalMinutes || (p.stats.totalPlayed * (gameConfig.shiftDuration || 6)).toFixed(0)}m</td>
          <td style="text-align: center; font-weight: bold;">${p.stats.totalPlayed}</td>
          <td style="text-align: center; color: #666;">${p.stats.BENCH}</td>
          <td style="text-align: center;"><span class="num-pill pos-GK">${p.stats.GK}</span></td>
          <td style="text-align: center;"><span class="num-pill pos-DEF">${p.stats.DEF}</span></td>
          <td style="text-align: center;"><span class="num-pill pos-MID">${p.stats.MID}</span></td>
          <td style="text-align: center;"><span class="num-pill pos-FWD">${p.stats.FWD}</span></td>
        </tr>
      `).join('');
    }

    function generateLineup() {
      const available = players.filter(p => p.present);
      if (available.length === 0) {
        alert("Mark players as attending before generating lineup!");
        return;
      }
      const hasPrev = Object.values(currentAssignment).some(arr => arr && arr.length > 0);
      if (hasPrev) {
        previousAssignment = JSON.parse(JSON.stringify(currentAssignment));
      }

      const totalSlots = formation.GK + formation.DEF + formation.MID + formation.FWD;
      let pool = [...available].sort((a, b) => {
        let diff = a.stats.totalPlayed - b.stats.totalPlayed;
        return diff !== 0 ? diff : (Math.random() - 0.5);
      });

      const onField = pool.slice(0, totalSlots);
      const onBench = pool.slice(totalSlots);
      currentAssignment = { GK: [], DEF: [], MID: [], FWD: [], BENCH: onBench };

      let slots = [];
      for (let i = 0; i < formation.GK; i++) slots.push('GK');
      for (let i = 0; i < formation.DEF; i++) slots.push('DEF');
      for (let i = 0; i < formation.MID; i++) slots.push('MID');
      for (let i = 0; i < formation.FWD; i++) slots.push('FWD');

      let unassigned = [...onField];
      if (slots.includes('GK')) {
        unassigned.sort((a, b) => a.stats.GK - b.stats.GK || (Math.random() - 0.5));
        let gk = unassigned.shift();
        currentAssignment.GK.push(gk);
        slots.splice(slots.indexOf('GK'), 1);
      }

      slots.forEach(pos => {
        unassigned.sort((a, b) => a.stats[pos] - b.stats[pos] || (Math.random() - 0.5));
        let p = unassigned.shift();
        currentAssignment[pos].push(p);
      });

      saveAll();
      renderPitch();
      renderSubstitutionCallout();
    }

    function renderSubstitutionCallout() {
      const container = document.getElementById('subsContainer');
      if (!previousAssignment) {
        container.innerHTML = `
          <div style="background: white; padding: 8px; border-radius: 6px; font-size: 13px;">
            <b>Starting Lineup:</b> All on-field players enter the pitch.
          </div>
        `;
        return;
      }

      const prevField = [
        ...(previousAssignment.GK || []),
        ...(previousAssignment.DEF || []),
        ...(previousAssignment.MID || []),
        ...(previousAssignment.FWD || [])
      ];

      const currentField = [
        ...(currentAssignment.GK || []).map(p => ({ ...p, assignedPos: 'GK' })),
        ...(currentAssignment.DEF || []).map(p => ({ ...p, assignedPos: 'DEF' })),
        ...(currentAssignment.MID || []).map(p => ({ ...p, assignedPos: 'MID' })),
        ...(currentAssignment.FWD || []).map(p => ({ ...p, assignedPos: 'FWD' }))
      ];

      const goingOut = prevField.filter(prevP => !currentField.some(currP => currP.id === prevP.id));
      const comingIn = currentField.filter(currP => !prevField.some(prevP => prevP.id === currP.id));

      if (goingOut.length === 0 && comingIn.length === 0) {
        container.innerHTML = `
          <div style="background: white; padding: 8px; border-radius: 6px; font-size: 13px; color: #555;">
            No substitutions this shift (all players stay in current status).
          </div>
        `;
        return;
      }

      const maxRows = Math.max(goingOut.length, comingIn.length);
      let rowsHtml = '';
      for (let i = 0; i < maxRows; i++) {
        const inPlayer = comingIn[i];
        const outPlayer = goingOut[i];
        rowsHtml += `
          <tr>
            <td>
              ${inPlayer ? `<span class="sub-tag-in">🟢 IN</span> <b>#${inPlayer.number}</b> ${inPlayer.name} <small style="color: #555;">(${inPlayer.assignedPos})</small>` : `<span style="color:#aaa;">—</span>`}
            </td>
            <td style="text-align: center; color: #999; font-weight: bold;">➔</td>
            <td>
              ${outPlayer ? `<span class="sub-tag-out">🔴 OUT</span> <b>#${outPlayer.number}</b> ${outPlayer.name} <small style="color: #666;">(to Bench)</small>` : `<span style="color:#aaa;">—</span>`}
            </td>
          </tr>
        `;
      }
      container.innerHTML = `
        <table class="sub-table">
          <thead>
            <tr>
              <th style="width: 48%;">Entering Pitch (IN)</th>
              <th style="width: 4%;"></th>
              <th style="width: 48%;">Heading to Bench (OUT)</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      `;
    }

    function renderPitch() {
      const renderRow = (containerId, playerList, posLabel, isGk = false) => {
        const container = document.getElementById(containerId);
        container.innerHTML = (playerList || []).map(p => `
          <div class="pitch-player ${isGk ? 'gk-token' : ''}">
            <div class="pitch-circle">#${p.number}</div>
            <div class="pitch-name">${p.name}</div>
            <div class="pitch-pos-label">${posLabel}</div>
          </div>
        `).join('');
      };

      renderRow('pitchFWD', currentAssignment.FWD, 'FWD');
      renderRow('pitchMID', currentAssignment.MID, 'MID');
      renderRow('pitchDEF', currentAssignment.DEF, 'DEF');
      renderRow('pitchGK', currentAssignment.GK, 'GK', true);

      const benchContainer = document.getElementById('benchContainer');
      const benchCount = document.getElementById('benchCount');
      const benchPlayers = currentAssignment.BENCH || [];
      benchCount.innerText = `(${benchPlayers.length} resting)`;

      if (benchPlayers.length === 0) {
        benchContainer.innerHTML = `<span style="font-size: 13px; color: #888;">No players on bench.</span>`;
      } else {
        benchContainer.innerHTML = benchPlayers.map(p => `
          <div class="bench-player-pill">
            <span class="bench-number">#${p.number}</span>
            <span class="bench-name">${p.name}</span>
          </div>
        `).join('');
      }
    }

    function confirmShiftAndAdvance() {
      const hasFieldPlayers = ['GK', 'DEF', 'MID', 'FWD'].some(pos => currentAssignment[pos]?.length > 0);
      if (!hasFieldPlayers) {
        alert("Generate a lineup before advancing!");
        return;
      }
      const shiftMins = parseFloat(gameConfig.shiftDuration) || 6;
      ['GK', 'DEF', 'MID', 'FWD'].forEach(pos => {
        (currentAssignment[pos] || []).forEach(assigned => {
          let p = players.find(x => x.id === assigned.id);
          if (p) {
            p.stats[pos]++;
            p.stats.totalPlayed++;
            p.stats.totalMinutes = (p.stats.totalMinutes || 0) + Math.round(shiftMins);
          }
        });
      });

      (currentAssignment.BENCH || []).forEach(assigned => {
        let p = players.find(x => x.id === assigned.id);
        if (p) p.stats.BENCH++;
      });

      timerState.shift++;
      document.getElementById('shiftIndicator').innerText = `SHIFT ${timerState.shift}`;
      resetTimer();
      saveAll();
      renderAttendanceTable();
      generateLineup();
    }

    function exportToCSV() {
      let csv = "Number,Name,Estimated Minutes,Shifts On Field,Bench Shifts,GK,DEF,MID,FWD\n";
      players.forEach(p => {
        const estMins = p.stats.totalMinutes || (p.stats.totalPlayed * (gameConfig.shiftDuration || 6)).toFixed(0);
        csv += `"${p.number}","${p.name}",${estMins},${p.stats.totalPlayed},${p.stats.BENCH},${p.stats.GK},${p.stats.DEF},${p.stats.MID},${p.stats.FWD}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `soccer_season_stats_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function resetSeason() {
      if (confirm("Reset ALL player stats and shift counts to zero?")) {
        players.forEach(p => {
          p.stats = { GK: 0, DEF: 0, MID: 0, FWD: 0, BENCH: 0, totalPlayed: 0, totalMinutes: 0 };
        });
        timerState.shift = 1;
        document.getElementById('shiftIndicator').innerText = `SHIFT 1`;
        currentAssignment = { GK: [], DEF: [], MID: [], FWD: [], BENCH: [] };
        previousAssignment = null;
        resetTimer();
        saveAll();
        renderAttendanceTable();
        renderSeasonStats();
        renderPitch();
        renderSubstitutionCallout();
      }
    }

    document.getElementById('numGK').value = formation.GK;
    document.getElementById('numDEF').value = formation.DEF;
    document.getElementById('numMID').value = formation.MID;
    document.getElementById('numFWD').value = formation.FWD;

    initTimerFromStorage();
    renderAttendanceTable();
    renderPitch();
    renderSubstitutionCallout();
    calculateFairPlay();
  </script>
</body>

  </script>
